name: Build Play! PS2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ANDROID_NDK_VERSION: "25.2.9519653"
  ANDROID_CMAKE_VERSION: "3.31.1"
  ANDROID_BUILD_TOOLS_VERSION: "34.0.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK, CMake e build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"
          sdkmanager "cmake;${ANDROID_CMAKE_VERSION}" || echo "cmake sera baixado pelo Gradle"
          sdkmanager "ndk;${ANDROID_NDK_VERSION}" || echo "ndk sera baixado pelo Gradle"

      - name: Clonar Play! com submodules
        run: git clone --recurse-submodules https://github.c
