name: Build Play! PS2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ANDROID_NDK_VERSION: "25.2.9519653"
  ANDROID_CMAKE_VERSION: "3.22.1"
  ANDROID_BUILD_TOOLS_VERSION: "34.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clonar Play! com submodules
        run: git clone --recurse-submodules https://github.com/jpd002/Play-.git

      - name: Instalar SDK, NDK e CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" \
                  "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
                  "ndk;${ANDROID_NDK_VERSION}" \
                  "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Compilar (release, somente arm64-v8a)
        working-directory: Play-/build_android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Alinhar e assinar com chave de debug
        run: |
          BT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS_VERSION}"
          UNSIGNED=$(find Play-/build_android -name "*release*.apk" | head -n 1)
          echo "APK encontrado: $UNSIGNED"
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --out Play-PS2-arm64-debugsigned.apk aligned.apk
          "$BT/apksigner" verify Play-PS2-arm64-debugsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Play-PS2-APK
          path: Play-PS2-arm64-debugsigned.apk
          if-no-files-found: error
